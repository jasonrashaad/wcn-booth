<!doctype html>
<meta charset="utf-8">
<title>booth — avatar (phase 0 placeholder)</title>
<style>
  /* Transparent so OBS composites it over the set. Placeholder art: the real
     "?" mark with a mouth layer lands in Phase 2. */
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               font-family: Raleway, system-ui, sans-serif; }
  #stage { position:relative; width:1280px; height:720px; }
  #head  { position:absolute; left:440px; top:80px; width:400px; height:400px;
           border-radius:50%; background:#111; border:6px solid #e8e8e8; }
  #mouth { position:absolute; left:50%; top:66%; transform:translate(-50%,-50%);
           width:120px; background:#ff2d55; border-radius:60px;
           height:8px; transition:height 30ms linear; }
  #mouth.s1 { height:34px; }
  #mouth.s2 { height:70px; }
  #lower { position:absolute; left:80px; right:80px; bottom:56px; padding:18px 26px;
           background:rgba(0,0,0,.72); color:#fff; font-size:34px; line-height:1.25;
           border-left:10px solid #ff2d55; display:none; }
  #lower.on { display:block; }
</style>
<div id="stage">
  <div id="head"><div id="mouth"></div></div>
  <div id="lower"></div>
</div>
<script>
  const mouth = document.getElementById('mouth'), lower = document.getElementById('lower');
  let seen = -1, raf = 0;

  async function play(q) {
    cancelAnimationFrame(raf);
    const tl = await (await fetch(`/ep/${q.audio.replace(/\.wav$/, '.timeline.json')}`)).json();
    const a = new Audio(`/ep/${q.audio}`);
    lower.textContent = q.text; lower.classList.add('on');
    a.addEventListener('ended', () => { mouth.className = ''; });
    await a.play();   // OBS Browser Source is allowed to autoplay; a normal tab may not.
    const tick = () => {
      const i = Math.floor(a.currentTime * 1000 / tl.frame_ms);
      mouth.className = 's' + (tl.states[i] ?? 0);
      if (!a.ended) raf = requestAnimationFrame(tick);
    };
    tick();
  }

  async function poll() {
    try {
      const s = await (await fetch('/api/state')).json();
      if (s.serial !== seen) { seen = s.serial; if (s.question) play(s.question); }
    } catch (e) {}
    setTimeout(poll, 250);
  }
  poll();
</script>
