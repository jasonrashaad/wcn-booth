<!doctype html>
<meta charset="utf-8">
<title>The Coach</title>
<style>
  /* The Coach: the WCN "?" mark on a teal CRT. The dot is the mouth.
     Space Ghost, not SadTalker: three mouth states off the audio timeline, and the
     rest is texture — scanlines, a soft RGB split, a flicker, a stutter on cue.
     Page background is transparent so OBS composites the panel over the set. */
  @font-face { font-family: Raleway; src: url(assets/fonts/raleway-latin-var.woff2) format('woff2');
               font-weight: 100 900; font-display: swap; }
  :root { --teal:#216869; --teal-deep:#1a5354; --ink:#0e1614; --fg:#f4f4f4; --gold:#EAAA00; --coral:#e76f51; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               font-family: Raleway, system-ui, sans-serif; }
  #stage { position:relative; width:1280px; height:720px; }

  /* the tube */
  #tube { position:absolute; inset:24px; border-radius:38px; overflow:hidden;
          background: radial-gradient(ellipse at 50% 45%, var(--teal) 0%, var(--teal-deep) 70%, #123a3b 100%);
          box-shadow: inset 0 0 120px rgba(0,0,0,.55), 0 0 0 14px var(--ink), 0 0 0 16px #2a3a38; }
  #tube::after { /* scanlines */ content:""; position:absolute; inset:0; pointer-events:none;
          background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 4px);
          mix-blend-mode:multiply; }
  #vignette { position:absolute; inset:0; pointer-events:none;
          background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }
  #flicker { position:absolute; inset:0; pointer-events:none; background:#fff; opacity:0;
          animation: flick 4s steps(1) infinite; mix-blend-mode:overlay; }
  @keyframes flick { 0%,93%,100%{opacity:0} 94%{opacity:.05} 95%{opacity:0} 97%{opacity:.03} 98%{opacity:0} }

  /* the mark: three copies for the RGB split, then the real one */
  .mark { position:absolute; left:50%; top:50%; width:300px; height:390px;
          transform: translate(-50%,-64%); }
  .mark.r  path, .mark.r  ellipse { fill:#ff3b5c; }
  .mark.b  path, .mark.b  ellipse { fill:#38b6ff; }
  .mark.r, .mark.b { opacity:.45; mix-blend-mode:screen; pointer-events:none; }
  .mark.r { transform: translate(calc(-50% - 5px), -64%); }
  .mark.b { transform: translate(calc(-50% + 5px), -64%); }
  .mark.main path, .mark.main ellipse { fill: var(--fg); }
  .mark.main { filter: drop-shadow(0 0 18px rgba(244,244,244,.35)); }

  /* the mouth: the dot. rx/ry are set from the timeline state */
  ellipse { transition: rx 40ms linear, ry 40ms linear; }

  /* stutter on cue */
  #stage.stutter .mark { animation: jolt .55s steps(2) 1; }
  @keyframes jolt { 0%{transform:translate(-48%,-64%) skewX(-8deg)} 25%{transform:translate(-52%,-65%) skewX(6deg)}
                    50%{transform:translate(-50%,-63%)} 75%{transform:translate(-51%,-64%) skewX(-3deg)} 100%{transform:translate(-50%,-64%)} }
  #stage.stutter #tube { animation: roll .55s linear 1; }
  @keyframes roll { 0%{background-position:0 0} 100%{background-position:0 -40px} }

  /* lower third */
  #lower { position:absolute; left:64px; right:64px; bottom:60px; padding:16px 24px 18px 26px;
           background: rgba(14,22,20,.82); color:var(--fg); font-size:30px; font-weight:400; line-height:1.28;
           border-left: 8px solid var(--gold); letter-spacing:.01em; opacity:0; transform:translateY(8px);
           transition: opacity .25s ease, transform .25s ease; }
  #lower.on { opacity:1; transform:none; }
  #lower small { display:block; font-size:15px; font-weight:600; color:var(--gold); letter-spacing:.14em;
                 text-transform:uppercase; margin-bottom:6px; }
  #tally { position:absolute; right:56px; top:52px; color:var(--fg); opacity:.6; font-size:18px; font-weight:600;
           letter-spacing:.14em; }
</style>

<script>
  // Mouth shapes for the dot: closed / mid / open, as (rx, ry) in mark units.
  const MOUTH = [[6, 6], [7.5, 4.5], [7, 9.5]];
  const dots = [...document.querySelectorAll('ellipse')];
  const stage = document.getElementById('stage'), lower = document.getElementById('lower'),
        qEl = document.getElementById('q'), tally = document.getElementById('tally');
  let seen = -1, raf = 0, current = null;

  function mouth(s) { for (const d of dots) { d.setAttribute('rx', MOUTH[s][0]); d.setAttribute('ry', MOUTH[s][1]); } }

  // Idle: an occasional tiny "blink" of the dot so the tube never looks frozen.
  setInterval(() => { if (!current) { mouth(1); setTimeout(() => mouth(0), 90); } }, 3800 + Math.random()*2500);

  async function play(q, index, count) {
    cancelAnimationFrame(raf);
    if (current) { current.pause(); current = null; }
    const tl = await (await fetch(`/ep/${q.audio.replace(/\.wav$/, '.timeline.json')}`)).json();
    const a = new Audio(`/ep/${q.audio}`);
    current = a;
    stage.classList.remove('stutter'); void stage.offsetWidth; stage.classList.add('stutter');
    tally.textContent = `${String(index + 1).padStart(2, '0')} / ${String(count).padStart(2, '0')}`;
    qEl.textContent = q.text; lower.classList.add('on');
    a.addEventListener('ended', () => { mouth(0); current = null; });
    await a.play();   // the OBS Browser Source may autoplay; a normal tab needs a click first
    const tick = () => {
      const i = Math.floor(a.currentTime * 1000 / tl.frame_ms);
      mouth(tl.states[i] ?? 0);
      if (!a.ended) raf = requestAnimationFrame(tick);
    };
    tick();
  }

  async function poll() {
    try {
      const s = await (await fetch('/api/state')).json();
      if (s.serial !== seen) { seen = s.serial; if (s.question) play(s.question, s.index, s.count); }
    } catch (e) {}
    setTimeout(poll, 250);
  }
  poll();
  mouth(0);
</script>
